name: Release to Tencent COS

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"

defaults:
  run:
    shell: bash

jobs:
  # ========== Windows 构建 + 直接上传 COS ==========
  build-windows:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: "package.json"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Package for Windows
        env:
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: npm run package:windows

      - name: Upload to Tencent COS
        env:
          TENCENT_SECRET_ID: ${{ secrets.TENCENT_SECRET_ID }}
          TENCENT_SECRET_KEY: ${{ secrets.TENCENT_SECRET_KEY }}
          MSYS_NO_PATHCONV: "1"
        shell: bash
        run: |
          pip install coscmd
          coscmd config \
            -a "${TENCENT_SECRET_ID}" \
            -s "${TENCENT_SECRET_KEY}" \
            -b teamost-releases-1340849355 \
            -r ap-beijing

          VERSION=$(jq -r '.version' package.json)
          echo ">>> 上传 Windows 产物 v${VERSION} ..."
          coscmd upload -r "release/${VERSION}/" "/desktop/${VERSION}/"
          echo ">>> Windows 上传完成！"

  # ========== macOS 构建 + 直接上传 COS ==========
  build-macos:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: "package.json"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Package for macOS
        run: |
          npm run build-prod
          npx electron-builder --mac --x64 --arm64 --publish=never

      - name: Upload to Tencent COS
        env:
          TENCENT_SECRET_ID: ${{ secrets.TENCENT_SECRET_ID }}
          TENCENT_SECRET_KEY: ${{ secrets.TENCENT_SECRET_KEY }}
          MSYS_NO_PATHCONV: "1"
        run: |
          pip install coscmd
          coscmd config \
            -a "${TENCENT_SECRET_ID}" \
            -s "${TENCENT_SECRET_KEY}" \
            -b teamost-releases-1340849355 \
            -r ap-beijing

          VERSION=$(jq -r '.version' package.json)
          echo ">>> 上传 macOS 产物 v${VERSION} ..."
          coscmd upload -r "release/${VERSION}/" "/desktop/${VERSION}/"
          echo ">>> macOS 上传完成！"

  # ========== Linux 构建 + 直接上传 COS ==========
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: "package.json"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ca-certificates libxtst-dev libpng++-dev \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu jq flatpak flatpak-builder
          sudo flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          sudo flatpak install -y --noninteractive flathub org.freedesktop.Platform/x86_64/25.08 org.freedesktop.Sdk/x86_64/25.08 org.electronjs.Electron2.BaseApp/x86_64/25.08 org.freedesktop.Platform/aarch64/25.08 org.freedesktop.Sdk/aarch64/25.08 org.electronjs.Electron2.BaseApp/aarch64/25.08 || true

      - name: Install npm deps
        run: PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 npm ci

      - name: Package for Linux
        run: npm run package:linux

      - name: Upload to Tencent COS
        env:
          TENCENT_SECRET_ID: ${{ secrets.TENCENT_SECRET_ID }}
          TENCENT_SECRET_KEY: ${{ secrets.TENCENT_SECRET_KEY }}
          MSYS_NO_PATHCONV: "1"
        run: |
          pip install coscmd
          coscmd config \
            -a "${TENCENT_SECRET_ID}" \
            -s "${TENCENT_SECRET_KEY}" \
            -b teamost-releases-1340849355 \
            -r ap-beijing

          VERSION=$(jq -r '.version' package.json)
          echo ">>> 上传 Linux 产物 v${VERSION} ..."
          coscmd upload -r "release/${VERSION}/" "/desktop/${VERSION}/"
          echo ">>> Linux 上传完成！"

  # ========== 汇总：版本文件 + CDN刷新 + GitHub Release ==========
  finalize:
    runs-on: ubuntu-22.04
    needs:
      - build-windows
      - build-macos
      - build-linux
    if: always() && !cancelled()
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Generate version file & Refresh CDN
        env:
          TENCENT_SECRET_ID: ${{ secrets.TENCENT_SECRET_ID }}
          TENCENT_SECRET_KEY: ${{ secrets.TENCENT_SECRET_KEY }}
        run: |
          pip install coscmd tccli

          coscmd config \
            -a "${TENCENT_SECRET_ID}" \
            -s "${TENCENT_SECRET_KEY}" \
            -b teamost-releases-1340849355 \
            -r ap-beijing

          VERSION=$(jq -r '.version' package.json)
          echo ">>> 版本: ${VERSION}"

          # 生成版本文件
          if echo "${VERSION}" | grep -qP '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "${VERSION}" > /tmp/latest.txt
            coscmd upload /tmp/latest.txt /desktop/latest.txt
            echo "    latest.txt -> ${VERSION}"
          else
            CHANNEL=$(echo "${VERSION}" | grep -oP '^\d+\.\d+\.\d+-\K[^.]+')
            echo "${VERSION}" > "/tmp/${CHANNEL}.txt"
            coscmd upload "/tmp/${CHANNEL}.txt" "/desktop/${CHANNEL}.txt"
            echo "    ${CHANNEL}.txt -> ${VERSION}"
          fi

          # 刷新 CDN
          tccli configure set secretId "${TENCENT_SECRET_ID}"
          tccli configure set secretKey "${TENCENT_SECRET_KEY}"
          tccli configure set region ap-beijing

          echo ">>> 刷新 CDN..."
          tccli cdn PurgePathCache \
            --Paths '["https://releases.suqing.chat/desktop/latest.txt","https://releases.suqing.chat/desktop/'"${VERSION}"'/"]' \
            --FlushType flush

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(jq -r '.version' package.json)

          echo ">>> 创建 GitHub Release..."

          gh release create "v${VERSION}" \
            --title "Teamost Desktop v${VERSION}" \
            --notes "📦 自动构建完成

          下载地址: https://releases.suqing.chat/desktop/${VERSION}/

          | 平台 | 文件 |
          |------|------|
          | Windows x64 | [MSI 安装包](https://releases.suqing.chat/desktop/${VERSION}/teamost-desktop-setup-${VERSION}-win-x64.msi) |
          | Windows ARM64 | [MSI 安装包](https://releases.suqing.chat/desktop/${VERSION}/teamost-desktop-setup-${VERSION}-win-arm64.msi) |
          | macOS Universal | [DMG 安装包](https://releases.suqing.chat/desktop/${VERSION}/teamost-desktop-${VERSION}-mac-universal.dmg) |
          | Linux x64 | [tar.gz](https://releases.suqing.chat/desktop/${VERSION}/teamost-desktop-${VERSION}-linux-x64.tar.gz) |
          | Linux ARM64 | [tar.gz](https://releases.suqing.chat/desktop/${VERSION}/teamost-desktop-${VERSION}-linux-arm64.tar.gz) |" \
            --draft 2>/dev/null || echo "Release 已存在或创建失败，跳过"
